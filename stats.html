<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoderHub | Stats</title>
    <link rel="stylesheet" href="styles.css?v=20260819-0001" />
  </head>
  <body>
    <main class="page-shell">
      <nav class="top-nav">
        <a href="index.html">CoderHub</a>
        <span>/</span>
        <span>Stats</span>
      </nav>

      <section class="hero hero-section">
        <p class="eyebrow">Player Stats</p>
        <h1>Stats</h1>
        <p class="hero-copy">Right now this page tracks one thing: how many problems you truly solved without peeking.</p>
      </section>

      <section class="content-grid">
        <article class="content-card">
          <div class="section-heading">
            <h2>Problems Solved</h2>
          </div>
          <p class="progress-value" data-stat="problems-solved-total">0</p>
          <p class="solution-copy">This total only goes up when you finish a problem and answer <code>Yes</code> to the <code>Solved without peeking?</code> popup.</p>
        </article>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
